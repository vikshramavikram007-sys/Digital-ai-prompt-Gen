<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital AI Prompt Generator</title>

  <style>
    :root {
      --primary: #0056ff;
      --accent: #ffb400;
      --bg: #f5f7fa;
      --text: #222;
      --card: #fff;
      --radius: 10px;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
      --transition: 0.3s ease;
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: var(--card);
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 10;
      flex-wrap: wrap;
    }

    header h1 { color: var(--primary); font-size: 1.4rem; margin: 0; }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.2rem;
      margin: 0;
      padding: 0;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      min-height: 70vh;
    }

    .generator-card {
      background: var(--card);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 2rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    h2 { color: var(--primary); }

    .input-area {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input, button {
      padding: 0.9rem;
      border-radius: var(--radius);
      border: 1px solid #ccc;
      font-size: 1rem;
      width: 100%;
    }

    button {
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      border: none;
    }

    .output-card {
      margin-top: 1.5rem;
      background: var(--bg);
      padding: 1.2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-align: left;
      display: none;
    }

    .button-row {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary);
      color: white;
      padding: 0.8rem 1.2rem;
      border-radius: var(--radius);
      opacity: 0;
      transition: 0.3s;
      font-size: 0.9rem;
    }

    .toast.show { opacity: 1; }

    footer {
      background: var(--card);
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      border-top: 1px solid #eee;
    }
  </style>
</head>

<body>

<header>
  <h1>Digital AI Prompt Generator</h1>
</header>

<main>
  <div class="generator-card">
    <h2>Generate Creative Prompts Instantly</h2>

    <div class="input-area">
      <input id="seedInput" type="text" placeholder="Enter an idea or leave blank..." />
      <button id="generateBtn">Generate Prompt</button>
    </div>

    <div id="outputCard" class="output-card">
      <pre id="promptOutput"></pre>

      <div class="button-row">
        <button id="copyBtn">Copy</button>
        <button id="downloadBtn">Download</button>
      </div>
    </div>
  </div>
</main>

<footer>
  © 2025 Digital AI Prompt Generator
</footer>

<div id="toast" class="toast">Copied to clipboard!</div>

<script>
const names = ["Aarav","Maya","Lina","Eli","Nia","Theo","Zara","Ravi","Amara","Luca"];
const backgrounds = [
  "is a writer exploring futuristic technology.",
  "is an artist fascinated by human emotions.",
  "is a student learning how creativity works.",
  "is a designer inspired by nature’s patterns.",
  "is a game developer who loves storytelling."
];
const actions = [
  "Right now they’re writing new ideas in a notebook.",
  "They’re designing a unique project in their studio.",
  "Currently brainstorming a story with friends.",
  "They’re coding something amazing tonight.",
  "Right now they’re sketching their next big idea."
];

const generateBtn = document.getElementById("generateBtn");
const outputCard = document.getElementById("outputCard");
const promptOutput = document.getElementById("promptOutput");
const copyBtn = document.getElementById("copyBtn");
const downloadBtn = document.getElementById("downloadBtn");
const toast = document.getElementById("toast");

function random(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

generateBtn.onclick = () => {
  const seed = document.getElementById("seedInput").value.trim();
  const name = random(names);
  const prompt =
`Name: ${name}
Background: ${name} ${random(backgrounds)}
Foreground: ${random(actions)}
${seed ? "Idea: " + seed : ""}`;

  promptOutput.textContent = prompt;
  outputCard.style.display = "block";
};

copyBtn.onclick = () => {
  navigator.clipboard.writeText(promptOutput.textContent);
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1500);
};

downloadBtn.onclick = () => {
  const blob = new Blob([promptOutput.textContent], {type:"text/plain"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "prompt.txt";
  link.click();
};
</script>

</body>
</html>
